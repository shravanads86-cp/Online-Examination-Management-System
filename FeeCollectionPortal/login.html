<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fee Collection Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-box">
        <div class="login-logo">
            <div class="logo-icon">FC</div>
            <h1>Fee Collection Analysis Portal</h1>
            <p>Payment Tracking, Defaulter Analysis & Revenue Reporting</p>
        </div>

        <div id="loginAlert" class="alert alert-error hidden"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p style="text-align:center; margin-top:20px; font-size:0.85rem; color:#64748b;">
            Default: admin / admin123
        </p>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
