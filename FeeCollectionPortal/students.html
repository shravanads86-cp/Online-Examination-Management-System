<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - Fee Collection Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">FC</div>
                <h2>Fee Collection Portal</h2>
                <p>College Admin Panel</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span class="icon">&#9632;</span> Dashboard</a>
                <a href="students.html"><span class="icon">&#9632;</span> Student Management</a>
                <a href="payments.html"><span class="icon">&#9632;</span> Fee Payments</a>
                <a href="defaulters.html"><span class="icon">&#9632;</span> Defaulter Analysis</a>
                <a href="reports.html"><span class="icon">&#9632;</span> Revenue Reports</a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-outline btn-block" style="color:white; border-color:rgba(255,255,255,0.3);" onclick="logout()">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div style="display:flex; align-items:center; gap:15px;">
                    <button class="menu-toggle" id="menuToggle">&#9776;</button>
                    <h1>Student Management</h1>
                </div>
                <div class="user-info">
                    <span>Welcome, <strong id="adminUsername">Admin</strong></span>
                </div>
            </header>

            <div class="page-content">
                <div id="alertBox" class="alert hidden"></div>

                <div class="card">
                    <div class="card-header">
                        <h2 id="studentFormTitle">Add New Student</h2>
                    </div>
                    <div class="card-body">
                        <form id="studentForm">
                            <input type="hidden" id="editStudentId" value="">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Full Name *</label>
                                    <input type="text" id="studentName" name="name" required>
                                </div>
                                <div class="form-group">
                                    <label>USN *</label>
                                    <input type="text" id="studentUsn" name="usn" required placeholder="e.g. 1CS21CS001">
                                </div>
                                <div class="form-group">
                                    <label>Department *</label>
                                    <select id="studentDepartment" name="department" required>
                                        <option value="">Select Department</option>
                                        <option value="Computer Science">Computer Science</option>
                                        <option value="Electronics">Electronics</option>
                                        <option value="Mechanical">Mechanical</option>
                                        <option value="Civil">Civil</option>
                                        <option value="Information Science">Information Science</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Semester *</label>
                                    <select id="studentSemester" name="semester" required>
                                        <option value="">Select Semester</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="6">6</option>
                                        <option value="7">7</option>
                                        <option value="8">8</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Phone</label>
                                    <input type="tel" id="studentPhone" name="phone">
                                </div>
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" id="studentEmail" name="email">
                                </div>
                                <div class="form-group">
                                    <label>Total Fee (Rs.) *</label>
                                    <input type="number" id="studentTotalFee" name="total_fee" min="1" step="0.01" required>
                                </div>
                                <div class="form-group">
                                    <label>Due Date *</label>
                                    <input type="date" id="studentDueDate" name="due_date" required>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">Save Student</button>
                                <button type="reset" class="btn btn-outline" onclick="document.getElementById('editStudentId').value=''; document.getElementById('studentFormTitle').textContent='Add New Student';">Clear</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2>Student List</h2>
                    </div>
                    <div class="card-body">
                        <div class="search-bar">
                            <input type="text" id="studentSearch" placeholder="Search by name, USN, email or phone...">
                            <button class="btn btn-primary" onclick="searchStudents()">Search</button>
                        </div>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>USN</th>
                                        <th>Name</th>
                                        <th>Department</th>
                                        <th>Sem</th>
                                        <th>Phone</th>
                                        <th>Total Fee</th>
                                        <th>Paid</th>
                                        <th>Pending</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="studentsTableBody">
                                    <tr><td colspan="10" class="empty-state">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/script.js"></script>
    <script>
        checkAuth().then(function(ok) {
            if (ok) loadStudents();
        });
    </script>
</body>
</html>
